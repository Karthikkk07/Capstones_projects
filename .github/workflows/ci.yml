name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test ${{ matrix.project }} / ${{ matrix.part }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [FS-04, FS-03]
        part: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.project }}/${{ matrix.part }}
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/${{ matrix.part }}/package-lock.json
      - run: npm ci
      - name: Prisma generate and validate
        if: matrix.part == 'backend'
        run: npx prisma generate && npx prisma validate
      - run: npx tsc --noEmit
      - run: npm test
      - name: Build frontend
        if: matrix.part == 'frontend'
        run: npm run build

  docker:
    name: Image ${{ matrix.project }} / ${{ matrix.part }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [FS-04, FS-03]
        part: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image name
        id: img
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/$(echo '${{ matrix.project }}' | tr 'A-Z' 'a-z')-${{ matrix.part }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.project }}/${{ matrix.part }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hooks
        env:
          HOOKS: ${{ secrets.RENDER_DEPLOY_HOOKS }}
        run: |
          if [ -z "$HOOKS" ]; then
            echo "RENDER_DEPLOY_HOOKS secret not set; skipping deploy."
            exit 0
          fi
          for hook in $HOOKS; do curl -fsS -X POST "$hook"; done
